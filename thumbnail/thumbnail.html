<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>조별 휴가 신청판 썸네일</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0e2a52; --navy2:#173d72; --sky:#8fb8ef; --ink:#162030; --muted:#5a6577; --line:#d6dce6;
  --ok:#1b7446; --ok-soft:#dff1e6; --full:#b0352d; --full-soft:#f8e1de; --wait:#8f5d00; --wait-soft:#faedd0;
  --day:#a8620a; --day-soft:#fbecd3; --night:#34428a; --night-soft:#e2e5f6; --off:#6f7888; --off-soft:#eceef2;
  --font:"IBM Plex Sans KR","Malgun Gothic",sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:800px;overflow:hidden}
body{font-family:var(--font);color:#fff;background:
  radial-gradient(900px 600px at 85% 20%, #24528f 0%, transparent 60%),
  linear-gradient(160deg,var(--navy2) 0%,var(--navy) 70%);position:relative}
/* 활주로 느낌의 사선 줄 */
body::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,255,255,.035) 46px 48px)}
.left{position:absolute;left:72px;top:84px;width:470px;display:flex;flex-direction:column;gap:26px}
.eyebrow{font-family:var(--mono);font-size:18px;letter-spacing:.14em;color:var(--sky);font-weight:600}
h1{font-size:76px;line-height:1.08;font-weight:700;letter-spacing:-.03em}
h1 span{color:#ffd27a}
.lead{font-size:27px;line-height:1.45;color:#dbe6f6;font-weight:500}
.lead b{color:#fff}
.feats{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.feat{display:flex;align-items:center;gap:14px;font-size:22px;font-weight:600;color:#fff}
.feat i{flex:none;width:34px;height:34px;border-radius:9px;background:rgba(143,184,239,.18);border:1px solid rgba(143,184,239,.45);display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:16px;color:var(--sky)}

.card{position:absolute;right:64px;top:70px;width:620px;background:#fff;color:var(--ink);border-radius:18px;padding:22px 22px 24px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.bar h2{font-size:24px;font-weight:700}
.bar h2 .num{font-family:var(--mono)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg span{padding:5px 11px;font-size:14px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg span:last-child{border-right:0}
.seg .on{background:#1d4f91;color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dow{background:#f6f8fb;text-align:center;font-size:13px;font-weight:600;color:var(--muted);padding:5px 0}
.cell{background:#fff;height:84px;padding:6px 7px;display:flex;flex-direction:column;gap:4px;position:relative}
.cell.blank{background:#f6f8fb}
.cell.mine{box-shadow:inset 0 0 0 3px #1d4f91;background:#f2f7ff}
.d{font-family:var(--mono);font-size:14px;font-weight:600}
.sun{color:var(--full)} .sat{color:#1d4f91}
.duty{font-size:12px;font-weight:700;padding:1px 6px;border-radius:4px;width:fit-content}
.D{background:var(--day-soft);color:var(--day)} .N{background:var(--night-soft);color:var(--night)} .O{background:var(--off-soft);color:var(--off)}
.seat{font-size:12px;font-weight:700;padding:1px 6px;border-radius:4px;width:fit-content;white-space:nowrap}
.ok{background:var(--ok-soft);color:var(--ok)} .full{background:var(--full-soft);color:var(--full)} .wait{background:var(--wait-soft);color:var(--wait)}

.pop{position:absolute;right:300px;bottom:44px;width:400px;background:#fff;color:var(--ink);border-radius:16px;padding:20px 22px;box-shadow:0 24px 60px rgba(0,0,0,.4);border:2px solid #1d4f91;display:flex;flex-direction:column;gap:10px}
.pop .t{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:700}
.chip{font-size:14px;font-weight:700;padding:3px 10px;border-radius:12px;background:#e2ebf7;color:#1d4f91}
.pop .p{font-family:var(--mono);font-size:18px;font-weight:600}
.pop .m{font-size:16px;color:var(--muted)}
.pop .m b{color:var(--ok)}
.queue{position:absolute;right:52px;bottom:70px;width:230px;background:#fff8e8;color:var(--ink);border-radius:14px;padding:16px 18px;box-shadow:0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:6px;border:2px solid #e6b450}
.queue .t{font-size:16px;font-weight:700;color:var(--wait)}
.queue .m{font-size:14px;color:var(--muted);line-height:1.45}
.foot{position:absolute;left:72px;bottom:58px;font-family:var(--mono);font-size:16px;color:var(--sky);letter-spacing:.06em}
</style>
</head>
<body>
<div class="left">
  <div class="eyebrow">LEAVE BOARD · 휴가 관리</div>
  <h1>조별 휴가<br><span>신청판</span></h1>
  <p class="lead">"그날 비었나?"<br><b>신청 전에 달력에서 바로 확인</b>하고<br>링크 하나로 신청부터 결재표까지</p>
  <div class="feats">
    <div class="feat"><i>01</i>근무표 자동 계산 · 조별 자리 현황</div>
    <div class="feat"><i>02</i>선착순 확정 · 대기열 자동 승격</div>
    <div class="feat"><i>03</i>근무일만 연가 차감 · 결재표 엑셀</div>
  </div>
</div>

<div class="card">
  <div class="bar"><h2><span class="num">2026</span>년 <span class="num">12</span>월</h2>
    <div class="seg"><span>1조</span><span>2조</span><span class="on">3조</span><span>4조</span><span>5조</span><span>전체</span></div></div>
  <div class="cal" id="cal"></div>
</div>

<div class="pop">
  <div class="t">연가 신청 <span class="chip">확정 · 승인 대기</span></div>
  <div class="p">12.17.(목) ~ 12.19.(토)</div>
  <div class="m">근무일 <b>2일</b> 차감 예정 · 17일 주간, 18일 야간</div>
</div>
<div class="queue">
  <div class="t">마감된 날은 대기 1번</div>
  <div class="m">앞사람이 취소·반려되면<br>자동으로 확정됩니다</div>
</div>

<script>
// 실제 페이지와 같은 근무 계산식(기준일 2026-11-01, 주간 2조)으로 3조 12월 달력을 그린다
const toN=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};
const toS=n=>new Date(n*864e5).toISOString().slice(0,10);
const dayTeam=s=>((((1+toN(s)-toN('2026-11-01'))%5)+5)%5)+1;
const duty=(t,s)=>dayTeam(s)===t?'D':dayTeam(toS(toN(s)-1))===t?'N':'O';
const L={D:'주간',N:'야간',O:'휴무'};
const full={3:1,8:1,11:2,22:1,24:1,31:1}, mine=[17,18,19];
let h=['일','월','화','수','목','금','토'].map((d,i)=>`<div class="dow ${i==0?'sun':i==6?'sat':''}">${d}</div>`).join('');
const lead=new Date(Date.UTC(2026,11,1)).getUTCDay();
for(let i=0;i<lead;i++)h+='<div class="cell blank"></div>';
for(let d=1;d<=31&&(lead+d)<=35;d++){
  const s=`2026-12-${String(d).padStart(2,'0')}`,w=(lead+d-1)%7,du=duty(3,s);
  let seat=mine.includes(d)?'<span class="seat full">마감</span>':full[d]===2?'<span class="seat wait">마감+대기1</span>':full[d]?'<span class="seat full">마감</span>':'<span class="seat ok">가능</span>';
  h+=`<div class="cell ${mine.includes(d)?'mine':''}"><span class="d ${w==0?'sun':w==6?'sat':''}">${d}</span><span class="duty ${du}">${L[du]}</span>${seat}</div>`;
}
for(let i=(lead+31)%7;i&&i<7;i++)h+='<div class="cell blank"></div>';
document.getElementById('cal').innerHTML=h;
</script>
</body>
</html>
